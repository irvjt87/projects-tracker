<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Projects Tracker">
  <title>Boys Projects & Budget Tracker</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f172a'/><text x='50%' y='68%' font-size='60' text-anchor='middle'>🛠️</text></svg>">

  <script>
    (function() {
      const canvas = document.createElement('canvas');
      canvas.width = 180; canvas.height = 180;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, 180, 180);
      ctx.font = '80px Apple Color Emoji, Segoe UI Emoji, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('🔨', 60, 95); ctx.fillText('🔧', 120, 95);
      const appleTouchIcon = document.createElement('link');
      appleTouchIcon.rel = 'apple-touch-icon';
      appleTouchIcon.href = canvas.toDataURL('image/png');
      document.head.appendChild(appleTouchIcon);
    })();
  </script>

  <style>
    :root {
      --bg-color: #0f172a; --card-bg: #1e293b; --card-border: #334155;
      --text-main: #f8fafc; --text-muted: #94a3b8; --accent-blue: #2563eb;
      --green: #10b981; --amber: #f59e0b; --red: #ef4444; --radius: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 8px; padding-top: calc(12px + env(safe-area-inset-top)); padding-bottom: max(24px, env(safe-area-inset-bottom)); max-width: 850px; margin: 0 auto; font-size: 13px; }
    input, select, button { font-size: 16px; padding: 4px 8px; border-radius: 4px; border: 1px solid var(--card-border); background: #090d16; color: #fff; outline: none; -webkit-appearance: none; appearance: none; }
    
    /* Top Bar & Allotment Summary */
    .summary-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 8px 12px; margin-bottom: 8px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
    .allotment-group { display: flex; align-items: center; gap: 6px; }
    .allotment-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
    .allotment-input { width: 80px; font-weight: 700; color: #60a5fa; text-align: center; }
    .metrics-group { display: flex; gap: 12px; flex-wrap: wrap; }
    .metric-item { display: flex; flex-direction: column; }
    .metric-label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
    .metric-val { font-size: 0.95rem; font-weight: 700; }

    .top-bar { display: flex; align-items: center; gap: 4px; margin-bottom: 8px; }
    .project-select { font-weight: 700; flex: 1; min-width: 0; height: 32px; }
    
    .btn { background: var(--card-bg); color: var(--text-main); font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 2px; flex-shrink: 0; height: 32px; padding: 0 10px; }
    .btn-primary { background: var(--accent-blue); color: white; border: none; }

    /* Form Panel */
    .form-panel { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 6px; margin-bottom: 10px; }
    .form-row { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
    .select-input { font-weight: 600; height: 30px; }
    .text-input { flex: 1; min-width: 120px; height: 30px; }
    .num-input-sm { width: 55px; height: 30px; text-align: center; }

    /* Item List Layout */
    .card-list { display: flex; flex-direction: column; gap: 4px; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-left: 3px solid var(--accent-blue); border-radius: var(--radius); padding: 6px 8px; display: flex; align-items: center; gap: 8px; }

    .card-content { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
    .item-info { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 140px; }
    .item-name { font-size: 0.9rem; font-weight: 700; color: white; }
    
    .price-calc-group { display: flex; align-items: center; gap: 4px; background: #090d16; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--card-border); }
    .calc-txt { font-size: 0.75rem; color: var(--text-muted); }
    .calc-total { font-size: 0.85rem; font-weight: 700; color: #4ade80; margin-left: 4px; }

    .badge { font-size: 0.65rem; font-weight: 700; padding: 1px 5px; border-radius: 3px; text-transform: uppercase; flex-shrink: 0; }
    .badge-owner-rodney { background: rgba(139, 92, 246, 0.2); color: #a78bfa; border: 1px solid #5b21b6; }
    .badge-owner-benji { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #78350f; }
    .badge-owner-both { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #064e3b; }

    .card-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .btn-icon-sm { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 2px 4px; font-size: 0.85rem; }

    .sync-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 6px; border-top: 1px solid var(--card-border); font-size: 0.75rem; color: var(--text-muted); }
  </style>
</head>
<body>

  <!-- Allotment Budget Summary Header -->
  <div class="summary-card">
    <div class="allotment-group">
      <span class="allotment-label">Total Allotment: $</span>
      <input type="number" id="allotmentFunds" class="allotment-input" value="200" step="10" onchange="updateAllotment(this.value)">
    </div>
    <div class="metrics-group">
      <div class="metric-item">
        <span class="metric-label">This Project</span>
        <span class="metric-val" id="projCostVal" style="color:#60a5fa;">$0.00 (0%)</span>
      </div>
      <div class="metric-item">
        <span class="metric-label">All Projects Total</span>
        <span class="metric-val" id="allProjCostVal">$0.00</span>
      </div>
      <div class="metric-item">
        <span class="metric-label">Remaining Buffer</span>
        <span class="metric-val" id="bufferVal" style="color:#4ade80;">$0.00</span>
      </div>
    </div>
  </div>

  <!-- Project Selector Controls -->
  <div class="top-bar">
    <select id="projectSelect" class="project-select" onchange="switchProject(this.value)"></select>
    <button class="btn btn-primary" onclick="addNewProject()">+ Project</button>
    <button class="btn" onclick="renameCurrentProject()">✏️</button>
    <button class="btn" onclick="deleteCurrentProject()">🗑️</button>
  </div>

  <!-- Item Entry Panel -->
  <div class="form-panel">
    <div class="form-row">
      <select id="newItemOwner" class="select-input">
        <option value="Unassigned">Unassigned</option>
        <option value="Rodney">Rodney</option>
        <option value="Benji">Benji</option>
      </select>
      <input type="text" id="newItemName" class="text-input" placeholder="Item Name / Part..." autocomplete="off">
      <span class="calc-txt">Qty:</span>
      <input type="number" id="newItemQty" class="num-input-sm" value="1" min="1">
      <span class="calc-txt">@ $</span>
      <input type="number" id="newItemPrice" class="num-input-sm" value="0.00" step="0.50">
      <button class="btn btn-primary" style="height:30px;" onclick="addNewItem()">Add Item</button>
    </div>
  </div>

  <div id="cardList" class="card-list"></div>

  <div class="sync-bar">
    <span id="syncStatus">GitHub Sync: Checking...</span>
    <button class="btn" style="height:24px; padding: 0 6px; font-size: 0.7rem;" onclick="configureGitHub()">Setup Connection</button>
  </div>

  <script>
    let config = JSON.parse(localStorage.getItem('gh_sync_config_projects')) || {
      owner: 'irvjt87',
      repo: 'projects-tracker',
      path: 'data.json',
      token: ''
    };

    let currentSha = null;
    let hasOfflineEdits = localStorage.getItem('gh_has_offline_edits_proj') === 'true';

    function configureGitHub() {
      const owner = prompt('GitHub Username:', config.owner) || config.owner;
      const repo = prompt('GitHub Repository Name:', config.repo) || config.repo;
      const token = prompt('GitHub Fine-Grained Token:', config.token) || config.token;

      config = { owner, repo, path: 'data.json', token: token.trim() };
      localStorage.setItem('gh_sync_config_projects', JSON.stringify(config));
      fetchMasterData();
    }

    function utf8_to_b64(str) { return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (m, p1) => String.fromCharCode('0x' + p1))); }
    function b64_to_utf8(str) { return decodeURIComponent(Array.prototype.map.call(atob(str), c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')); }

    async function fetchMasterData() {
      if (!config.token) {
        document.getElementById('syncStatus').innerText = 'GitHub Sync: Unconfigured (Tap Setup)';
        return;
      }
      document.getElementById('syncStatus').innerText = 'GitHub Sync: Syncing...';

      try {
        const res = await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/contents/${config.path}`, {
          headers: { 'Authorization': `Bearer ${config.token}`, 'Accept': 'application/vnd.github.v3+json' }
        });
        if (!res.ok) throw new Error('Network error');

        const data = await res.json();
        currentSha = data.sha;
        const remoteContent = JSON.parse(b64_to_utf8(data.content));

        if (hasOfflineEdits) {
          if (confirm("Offline edits found. Overwrite online master version with this iPad's version now?")) {
            await pushToMaster(appData);
          } else {
            appData = remoteContent;
            hasOfflineEdits = false;
            localStorage.setItem('gh_has_offline_edits_proj', 'false');
            saveLocalState();
          }
        } else {
          appData = remoteContent;
          saveLocalState();
        }
        document.getElementById('syncStatus').innerText = 'GitHub Sync: Master Online';
      } catch (e) {
        document.getElementById('syncStatus').innerText = 'GitHub Sync: Offline Mode';
      }
    }

    async function pushToMaster(dataToPush) {
  if (!config.token || !navigator.onLine) {
    hasOfflineEdits = true;
    localStorage.setItem('gh_has_offline_edits_proj', 'true');
    document.getElementById('syncStatus').innerText = 'GitHub Sync: Saved Offline';
    return;
  }

  try {
    // 1. Always fetch the latest SHA immediately before pushing to avoid 409 conflicts
    const getRes = await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/contents/${config.path}`, {
      headers: { 
        'Authorization': `Bearer ${config.token}`,
        'Accept': 'application/vnd.github.v3+json'
      }
    });

    if (getRes.ok) {
      const fileData = await getRes.json();
      currentSha = fileData.sha;
    } else if (getRes.status === 404) {
      // File doesn't exist on GitHub yet; currentSha remains null to create it
      currentSha = null;
    } else {
      throw new Error(`GitHub Auth/Read Error (${getRes.status}: ${getRes.statusText})`);
    }

    // 2. Prepare payload
    const jsonStr = JSON.stringify(dataToPush, null, 2);
    const payload = {
      message: 'Projects Tracker Auto-Update',
      content: utf8_to_b64(jsonStr)
    };
    if (currentSha) payload.sha = currentSha;

    // 3. PUT payload to GitHub API
    const pushRes = await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/contents/${config.path}`, {
      method: 'PUT',
      headers: { 
        'Authorization': `Bearer ${config.token}`, 
        'Content-Type': 'application/json' 
      },
      body: JSON.stringify(payload)
    });

    if (!pushRes.ok) {
      const errData = await pushRes.json().catch(() => ({}));
      throw new Error(`Push Rejected (${pushRes.status}: ${errData.message || pushRes.statusText})`);
    }

    const pushData = await pushRes.json();
    currentSha = pushData.content.sha;
    hasOfflineEdits = false;
    localStorage.setItem('gh_has_offline_edits_proj', 'false');
    document.getElementById('syncStatus').innerText = 'GitHub Sync: Master Online';
    alert('Master updated successfully on GitHub!');
  } catch (e) {
    hasOfflineEdits = true;
    localStorage.setItem('gh_has_offline_edits_proj', 'true');
    document.getElementById('syncStatus').innerText = 'GitHub Sync: Push Failed';
    alert(`Sync Error: ${e.message}`);
  }
}

    let appData = JSON.parse(localStorage.getItem('boys_projects_app_data')) || { allotment: 200, activeProjectId: '1', projects: [] };

    function saveLocalState() {
      localStorage.setItem('boys_projects_app_data', JSON.stringify(appData));
      render();
    }

    function saveAndSync() {
      saveLocalState();
      pushToMaster(appData);
    }

    function updateAllotment(val) {
      appData.allotment = parseFloat(val) || 0;
      saveAndSync();
    }

    function getActiveProject() {
      return appData.projects.find(p => p.id === appData.activeProjectId) || appData.projects[0] || { items: [] };
    }

    function switchProject(id) {
      appData.activeProjectId = id;
      saveLocalState();
    }

    function addNewProject() {
      const name = prompt('Enter New Project Name:');
      if (!name || !name.trim()) return;

      const newProj = { id: Date.now().toString(), name: name.trim(), updatedAt: Date.now(), items: [] };
      appData.projects.push(newProj);
      appData.activeProjectId = newProj.id;
      saveAndSync();
    }

    function renameCurrentProject() {
      const proj = getActiveProject();
      const newName = prompt('Rename Project:', proj.name);
      if (newName && newName.trim()) {
        proj.name = newName.trim();
        saveAndSync();
      }
    }

    function deleteCurrentProject() {
      if (appData.projects.length <= 1) { alert('You must keep at least one project.'); return; }
      const proj = getActiveProject();
      if (confirm(`Delete entire project "${proj.name}" and all child items?`)) {
        appData.projects = appData.projects.filter(p => p.id !== proj.id);
        appData.activeProjectId = appData.projects[0].id;
        saveAndSync();
      }
    }

    function addNewItem() {
      const activeProj = getActiveProject();
      const nameInput = document.getElementById('newItemName');
      const qtyInput = document.getElementById('newItemQty');
      const priceInput = document.getElementById('newItemPrice');
      const ownerInput = document.getElementById('newItemOwner');

      const name = nameInput.value.trim();
      if (!name) return;

      activeProj.items.push({
        id: Date.now().toString(),
        name: name,
        qty: parseInt(qtyInput.value, 10) || 1,
        price: parseFloat(priceInput.value) || 0,
        owner: ownerInput.value,
        updatedAt: Date.now()
      });

      nameInput.value = '';
      qtyInput.value = '1';
      priceInput.value = '0.00';
      saveAndSync();
    }

    function updateItemField(id, field, value) {
      const item = getActiveProject().items.find(i => i.id === id);
      if (item) {
        item[field] = field === 'name' || field === 'owner' ? value : (parseFloat(value) || 0);
        item.updatedAt = Date.now();
        saveAndSync();
      }
    }

    function deleteItem(id) {
      const proj = getActiveProject();
      const item = proj.items.find(i => i.id === id);
      if (confirm(`Delete item "${item ? item.name : 'this item'}" permanently?`)) {
        proj.items = proj.items.filter(i => i.id !== id);
        saveAndSync();
      }
    }

    function render() {
      const activeProj = getActiveProject();
      
      // Update Budget Header Inputs
      document.getElementById('allotmentFunds').value = appData.allotment || 200;

      // Calculate Costs
      const activeProjCost = (activeProj.items || []).reduce((sum, i) => sum + ((i.qty || 1) * (i.price || 0)), 0);
      const allProjCost = appData.projects.reduce((total, p) => total + (p.items || []).reduce((sum, i) => sum + ((i.qty || 1) * (i.price || 0)), 0), 0);
      const remainingBuffer = (appData.allotment || 0) - allProjCost;
      const projPct = appData.allotment > 0 ? ((activeProjCost / appData.allotment) * 100).toFixed(1) : '0';

      document.getElementById('projCostVal').innerText = `$${activeProjCost.toFixed(2)} (${projPct}%)`;
      document.getElementById('allProjCostVal').innerText = `$${allProjCost.toFixed(2)}`;
      
      const bufferEl = document.getElementById('bufferVal');
      bufferEl.innerText = `$${remainingBuffer.toFixed(2)}`;
      bufferEl.style.color = remainingBuffer >= 0 ? '#4ade80' : '#f87171';

      // Dropdown Options
      const projectSelect = document.getElementById('projectSelect');
      projectSelect.innerHTML = appData.projects.map(p => `<option value="${p.id}" ${p.id === activeProj.id ? 'selected' : ''}>${p.name}</option>`).join('');

      const cardList = document.getElementById('cardList');
      const items = activeProj.items || [];

      if (items.length === 0) {
        cardList.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 10px;">No items added to this project yet.</div>';
        return;
      }

      cardList.innerHTML = items.map(item => {
        let ownerBadgeClass = 'badge-owner-both';
        if (item.owner === 'Rodney') ownerBadgeClass = 'badge-owner-rodney';
        if (item.owner === 'Benji') ownerBadgeClass = 'badge-owner-benji';
        const itemTotal = (item.qty || 1) * (item.price || 0);

        return `
          <div class="card">
            <div class="card-content">
              <div class="item-info">
                <span class="badge ${ownerBadgeClass}">${item.owner}</span>
                <span class="item-name">${item.name}</span>
              </div>
              <div class="price-calc-group">
                <span class="calc-txt">Qty:</span>
                <input type="number" class="num-input-sm" value="${item.qty || 1}" min="1" onchange="updateItemField('${item.id}', 'qty', this.value)">
                <span class="calc-txt">@ $</span>
                <input type="number" class="num-input-sm" value="${(item.price || 0).toFixed(2)}" step="0.50" onchange="updateItemField('${item.id}', 'price', this.value)">
                <span class="calc-total">= $${itemTotal.toFixed(2)}</span>
              </div>
            </div>
            <div class="card-actions">
              <button class="btn-icon-sm" onclick="deleteItem('${item.id}')">🗑️</button>
            </div>
          </div>
        `;
      }).join('');
    }

    window.addEventListener('online', fetchMasterData);
    if (!config.token) configureGitHub(); else fetchMasterData();
    render();
  </script>
</body>
</html>
